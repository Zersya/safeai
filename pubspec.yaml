name: blockai
description: "blockAI: checks links before they open."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  go_router: ^18.1.4
  easy_localization: ^3.0.8
  shared_preferences: ^2.5.6
  sqflite: ^2.4.6
  path: ^1.9.1
  http: ^1.6.0
  crypto: ^3.0.8
  intl: ^0.20.3
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/icon_foreground.png

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/icon/
